name: terramag
description: Fully offline magnetic gradiometer survey app (ESP32 + RM3100).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  flutter_blue_plus: ^1.32.0
  flutter_onnxruntime: ^1.4.0     # check pub.dev for the latest version
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/best2.onnx
